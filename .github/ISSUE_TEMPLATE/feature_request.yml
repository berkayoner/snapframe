name: Feature request
description: Suggest an idea or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation, not the solution yet. "When I ... I have to ..."
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Your idea
      description: How could SnapFrame help? Sketches and examples from other tools are welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: This idea works without sending data off the device (or I explained why it can't).
